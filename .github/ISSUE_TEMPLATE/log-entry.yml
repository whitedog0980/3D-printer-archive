name: 3D 프린터 기록 (자동 문서화)
description: 메모와 사진만 남기면 AI가 문서 초안을 만들어 PR로 올려줍니다.
title: "[log] "
labels: ["log-entry"]
body:
  - type: dropdown
    id: category
    attributes:
      label: 카테고리
      description: 모르겠으면 auto로 두면 AI가 알아서 분류합니다.
      options:
        - auto
        - troubleshooting
        - quality
        - maintenance
        - parts
      default: 0
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: 메모
      description: >
        형식 신경 쓰지 말고 편하게 작성하세요. 증상/원인 추정/시도한 조치/결과 등을 아는 만큼만 적으면 됩니다.
        사진은 이 텍스트 박스 안에 직접 드래그 앤 드롭 하면 자동으로 이미지가 첨부됩니다.
      placeholder: |
        예)
        노즐이 자꾸 막혀서 출력이 중간에 끊김
        PLA, 210도, 압출 안됨
        콜드풀로 뚫었더니 해결됨
        아마 필라멘트에 먼지 낀 것 같음
    validations:
      required: true
